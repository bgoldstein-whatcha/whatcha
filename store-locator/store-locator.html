<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../assets/main.js"></script>
<script>
// ════════════════════════════════════════════════
//  Store data comes from stores.json (see that file for the format).
//  Coordinates are looked up automatically (OpenStreetMap Nominatim)
//  the first time a store is shown, then cached in this browser so
//  repeat visits don't re-geocode the same address.
// ════════════════════════════════════════════════
var STORES = [];
var map, tileLayer, markers = [], infoPopups = [], activeCard = null, comingSoonPopup = null;
var GEOCODE_CACHE_KEY = 'whatchaGeocodeCache';

function loadGeocodeCache() {
  try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveGeocodeCache(cache) {
  localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache));
}
function isGeocodeCached(address) {
  if (!address) return false;
  var cache = loadGeocodeCache();
  return !!(cache[address] || cache[address + '|us']);
}

function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

// Nominatim's usage policy asks for max ~1 request/sec and result caching,
// which is why every lookup is cached in localStorage by address.
function geocode(address, usOnly) {
  var cache = loadGeocodeCache();
  var cacheKey = usOnly ? address + '|us' : address;
  if (cache[cacheKey]) return Promise.resolve(cache[cacheKey]);
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
  // a bare zip code is ambiguous worldwide (e.g. "06110" also matches a Spanish
  // postcode) — restrict to the US when we know we're searching a US zip
  if (usOnly) url += '&countrycodes=us';
  return fetch(url).then(function (res) { return res.json(); }).then(function (data) {
    if (!data || !data.length) return null;
    var coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
    cache[cacheKey] = coords;
    saveGeocodeCache(cache);
    return coords;
  }).catch(function () { return null; });
}

var SUPABASE_URL = 'https://ivvoyzehxpdqtqmfsoxb.supabase.co';
// Publishable (public) key — safe in the browser; the view only exposes
// name + address of active stores, and RLS protects everything else.
var SUPABASE_KEY = 'sb_publishable_-_LLFYYSC5ctBmDL27gtdQ_P9343TDy';

function fetchStores() {
  return fetch(SUPABASE_URL + '/rest/v1/public_map_stores?select=name,address,city,state', {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  })
    .then(function (res) { if (!res.ok) throw new Error('map feed ' + res.status); return res.json(); })
    .then(function (rows) {
      return (rows || [])
        .filter(function (r) { return r.name && r.address; })
        .map(function (r) { return { name: r.name, address: r.address }; });
    })
    .catch(function (e) {
      console.warn('Live store feed unavailable, falling back to stores.json', e);
      return fetch('stores.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
    });
}

function haversine(lat1, lng1, lat2, lng2) {
  var R = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function clearMarkers() {
  markers.forEach(function (m) { map.removeLayer(m); });
  markers = [];
}

function addMarker(store, coords, index) {
  var icon = L.divIcon({
    className: 'store-marker',
    html: '<div style="width:22px;height:22px;border-radius:50%;background:var(--coral);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
  var marker = L.marker([coords.lat, coords.lng], { icon: icon }).addTo(map);
  var popupHtml = '<div class="store-popup"><h3>' + store.name + '</h3><p>' + store.address + '</p>' +
    (store.hours ? '<p>' + store.hours + '</p>' : '') + (store.phone ? '<p>' + store.phone + '</p>' : '') + '</div>';
  marker.bindPopup(popupHtml);
  marker.on('click', function () { selectStore(index); });
  markers.push(marker);
}

function addSidebarCard(store, index) {
  var card = document.createElement('div');
  card.className = 'store-card';
  card.id = 'card-' + index;
  card.innerHTML =
    '<div class="store-name">' + store.name + '</div>' +
    '<div class="store-address">' + store.address + '</div>' +
    (store.hours ? '<div class="store-hours">' + store.hours + '</div>' : '') +
    '<div class="store-distance" id="dist-' + index + '"></div>';
  card.onclick = function () { selectStore(index); map.panTo([store._lat, store._lng]); map.setZoom(14); };
  document.getElementById('store-list').appendChild(card);
}

function selectStore(index) {
  if (activeCard) activeCard.classList.remove('active');
  activeCard = document.getElementById('card-' + index);
  if (activeCard) activeCard.classList.add('active');
  markers[index].openPopup();
}

var isRendering = false;

async function geocodeAndRender(storesToRender) {
  isRendering = true;
  clearMarkers();
  document.getElementById('store-list').innerHTML = '';
  document.getElementById('no-results').style.display = 'none';
  document.getElementById('loading-state').style.display = storesToRender.length ? 'block' : 'none';

  var bounds = [];
  var rendered = 0;

  for (var i = 0; i < storesToRender.length; i++) {
    var store = storesToRender[i];
    var hadCoords = !!(store.lat && store.lng);
    // a cached address (or one we've already resolved) needs no network call,
    // so we can render it instantly — only uncached lookups get throttled below
    var wasCached = hadCoords || isGeocodeCached(store.address);
    var coords = hadCoords ? { lat: store.lat, lng: store.lng } : await geocode(store.address);
    if (!coords) continue;
    store._lat = coords.lat;
    store._lng = coords.lng;
    rendered++;
    bounds.push([coords.lat, coords.lng]);
    addMarker(store, coords, i);
    addSidebarCard(store, i);
    // stay comfortably under Nominatim's ~1 req/sec guidance for any uncached lookups
    if (!wasCached) await sleep(1100);
  }

  isRendering = false;
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('count').textContent = rendered;

  if (rendered === 0) {
    document.getElementById('no-results').style.display = 'block';
    // no live locations yet — show the "coming soon" notice pinned at map center
    if (!comingSoonPopup) {
      comingSoonPopup = L.popup({ closeButton: false, autoClose: false, closeOnClick: false })
        .setLatLng([39.8283, -98.5795])
        .setContent('<div class="store-popup"><h3>Coming soon!</h3><p>Whatcha is coming soon. Check back soon for retail locations.</p></div>');
    }
    comingSoonPopup.openOn(map);
  } else {
    // real locations exist — make sure the placeholder notice isn't floating over them
    if (comingSoonPopup) map.closePopup(comingSoonPopup);
    if (bounds.length === 1) {
      map.setView(bounds[0], 13);
    } else {
      map.fitBounds(bounds, { padding: [30, 30] });
    }
  }
}

function searchByZip() {
  var zip = document.getElementById('zip-input').value.trim();
  if (!zip) { geocodeAndRender(STORES); return; }

  geocode(zip, true).then(function (center) {
    if (!center) { alert('Could not find that zip code.'); return; }
    var R = 60; // miles radius
    var nearby = STORES.filter(function (s) {
      if (!s._lat || !s._lng) return true; // not yet geocoded — include, will resolve on render
      s._dist = haversine(center.lat, center.lng, s._lat, s._lng);
      return s._dist <= R;
    }).sort(function (a, b) { return (a._dist || 0) - (b._dist || 0); });

    geocodeAndRender(nearby).then(function () {
      nearby.forEach(function (s, i) {
        var el = document.getElementById('dist-' + i);
        if (el && s._dist != null) el.textContent = s._dist.toFixed(1) + ' mi away';
      });
    });
  });
}

document.getElementById('zip-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') searchByZip();
});

// ── Live auto-refresh ──
// The map reads the dashboard's public feed directly, so marking a store
// active in HQ already shows it on the next page load. This poll keeps a
// map that's ALREADY open in sync too: every 60s it re-checks the feed and
// re-renders only when the active-store list actually changed. Cached
// addresses re-render instantly (no re-geocoding), so this is cheap.
var POLL_MS = 60000;
var lastStoresSignature = '';

function storesSignature(list) {
  return (list || [])
    .map(function (s) { return (s.name || '') + '|' + (s.address || ''); })
    .sort()
    .join('~~');
}

function refreshStores() {
  if (isRendering) return;                                        // a render is mid-flight
  if (document.getElementById('zip-input').value.trim()) return;  // don't disrupt a zip search
  fetchStores().then(function (data) {
    var sig = storesSignature(data);
    if (sig === lastStoresSignature) return;                      // nothing changed
    lastStoresSignature = sig;
    STORES = data;
    geocodeAndRender(STORES);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  map = L.map('map', { scrollWheelZoom: false }).setView([39.8283, -98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  fetchStores().then(function (data) {
    STORES = data;
    lastStoresSignature = storesSignature(data);
    geocodeAndRender(STORES);
  });

  setInterval(refreshStores, POLL_MS);
});
</script>
