<script>
// ════════════════════════════════════════════════
//  Store data comes from stores.json (see that file for the format).
//  Coordinates are looked up automatically (OpenStreetMap Nominatim)
//  the first time a store is shown, then cached in this browser so
//  repeat visits don't re-geocode the same address.
// ════════════════════════════════════════════════
var STORES = [];
var map, markers = [], activeIdx = -1, refPoint = null, userPoint = null;
var GEOCODE_CACHE_KEY = 'whatchaGeocodeCache';
var DEFAULT_BOUNDS = [[38.85, -75.65], [42.1, -71.75]]; // CT + NJ

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function loadGeocodeCache() { try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)) || {}; } catch (e) { return {}; } }
function saveGeocodeCache(c) { try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(c)); } catch (e) {} }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// Nominatim is only a fallback now (stores carry saved coordinates) and for zip searches; cached by address.
function geocode(address, usOnly) {
  var cache = loadGeocodeCache(), key = usOnly ? address + '|us' : address;
  if (cache[key]) return Promise.resolve(cache[key]);
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
  if (usOnly) url += '&countrycodes=us';
  return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.length) return null;
    var c = { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
    cache[key] = c; saveGeocodeCache(cache); return c;
  }).catch(function () { return null; });
}

var SUPABASE_URL = 'https://ivvoyzehxpdqtqmfsoxb.supabase.co';
// Publishable (public) key — safe in the browser; the view only exposes name, address and map coordinates of active stores.
var SUPABASE_KEY = 'sb_publishable_-_LLFYYSC5ctBmDL27gtdQ_P9343TDy';

function mapRows(rows) {
  return (rows || []).filter(function (r) { return r.name && r.address; }).map(function (r) {
    return { name: r.name, address: r.address, lat: r.lat != null ? +r.lat : null, lng: r.lng != null ? +r.lng : null };
  });
}
function fetchStores() {
  function get(select) {
    return fetch(SUPABASE_URL + '/rest/v1/public_map_stores?select=' + select, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } })
      .then(function (res) { if (!res.ok) throw new Error('map feed ' + res.status); return res.json(); });
  }
  // lat/lng columns exist once the updated supabase-public-map.sql has been run; fall back to the older shape until then
  return get('name,address,city,state,lat,lng').catch(function () { return get('name,address,city,state'); })
    .then(mapRows)
    .catch(function (e) {
      console.warn('Live store feed unavailable, falling back to stores.json', e);
      return fetch('stores.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
    });
}

function haversine(lat1, lng1, lat2, lng2) {
  var R = 3958.8, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// One tap on a store selects it; the next tap (or the button) opens turn-by-turn directions
// in Apple Maps on iPhone/Mac, Google Maps everywhere else.
function directionsUrl(s) {
  var q = encodeURIComponent(s.name + ', ' + s.address);
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints > 0 || /iPhone|iPad|iPod/.test(navigator.userAgent) || /Mac/.test(navigator.platform));
  return apple ? 'https://maps.apple.com/?daddr=' + q + '&dirflg=d' : 'https://www.google.com/maps/dir/?api=1&destination=' + q;
}
function openDirections(i) {
  if (typeof gtag === 'function') gtag('event', 'store_directions');
  window.open(directionsUrl(STORES[i]), '_blank', 'noopener');
}

function pinIcon() {
  return L.divIcon({ className: '', html: '<div class="locator__pin"></div>', iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34] });
}

function buildMarkers() {
  markers.forEach(function (m) { if (m) map.removeLayer(m); });
  markers = []; activeIdx = -1;
  STORES.forEach(function (s, i) {
    if (s._lat == null) { markers.push(null); return; }
    var m = L.marker([s._lat, s._lng], { icon: pinIcon() }).addTo(map);
    m.bindPopup('<div class="store-popup"><h3>' + esc(s.name) + '</h3><p>' + esc(s.address) + '</p>' +
      '<a class="dir-btn" href="' + esc(directionsUrl(s)) + '" target="_blank" rel="noopener">Get directions &rarr;</a></div>');
    m.on('click', function () { selectStore(i, false); });
    markers.push(m);
  });
}

function selectStore(i, fromList) {
  if (i === activeIdx && fromList) { openDirections(i); return; }   // second tap → navigate
  activeIdx = i;
  var s = STORES[i];
  if (markers[i]) markers[i].openPopup();
  if (fromList) map.setView([s._lat, s._lng], Math.max(map.getZoom(), 14), { animate: true });
  renderList();
  var el = document.getElementById('card-' + i);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// The sidebar always shows the stores inside the current map view, nearest first —
// so panning/zooming the map loads the matching list automatically.
function renderList() {
  var b = map.getBounds(), known = refPoint || userPoint, c = known || map.getCenter();
  var vis = [];
  STORES.forEach(function (s, i) {
    if (s._lat == null) return;
    if (i === activeIdx || b.contains([s._lat, s._lng])) {
      s._dist = haversine(c.lat, c.lng, s._lat, s._lng);
      vis.push(i);
    }
  });
  vis.sort(function (x, y) { return STORES[x]._dist - STORES[y]._dist; });
  var list = document.getElementById('store-list');
  list.innerHTML = vis.map(function (i) {
    var s = STORES[i];
    return '<div class="store-card' + (i === activeIdx ? ' active' : '') + '" id="card-' + i + '" data-i="' + i + '" role="button" tabindex="0">' +
      '<div class="store-name">' + esc(s.name) + '</div>' +
      '<div class="store-address">' + esc(s.address) + '</div>' +
      (known ? '<div class="store-distance">' + s._dist.toFixed(1) + ' mi ' + (refPoint ? 'from your search' : 'away') + '</div>' : '') +
      '<div class="store-tap">Tap again to get directions</div>' +
      '<a class="store-dir" href="' + esc(directionsUrl(s)) + '" target="_blank" rel="noopener">Get directions &rarr;</a></div>';
  }).join('');
  document.getElementById('count').textContent = vis.length;
  var none = !vis.length;
  document.getElementById('no-results').textContent = STORES.length
    ? 'No Whatcha stores in this part of the map. Zoom out or drag the map to find the nearest ones.'
    : 'Loading stores…';
  document.getElementById('no-results').style.display = none ? 'block' : 'none';
}

document.getElementById('store-list').addEventListener('click', function (e) {
  if (e.target.closest('.store-dir')) return;               // the button is a normal link
  var card = e.target.closest('.store-card'); if (!card) return;
  selectStore(+card.getAttribute('data-i'), true);
});
document.getElementById('store-list').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var card = e.target.closest && e.target.closest('.store-card'); if (!card) return;
  e.preventDefault(); selectStore(+card.getAttribute('data-i'), true);
});

var geoRun = 0;
async function loadStores(data, frame) {
  STORES = data; var run = ++geoRun;
  STORES.forEach(function (s) { if (s.lat != null && s.lng != null && !isNaN(s.lat)) { s._lat = s.lat; s._lng = s.lng; } });
  document.getElementById('loading-state').style.display = 'none';
  buildMarkers(); renderList();
  if (frame) frameStores();
  // Stores without saved coordinates (until HQ has looked them up) resolve one by one, cached
  for (var i = 0; i < STORES.length; i++) {
    if (run !== geoRun) return;
    var s = STORES[i]; if (s._lat != null) continue;
    var cached = loadGeocodeCache()[s.address];
    var c = await geocode(s.address); if (run !== geoRun) return;
    if (!cached) await sleep(1100);
    if (!c) continue;
    s._lat = c.lat; s._lng = c.lng; buildMarkers(); renderList();
  }
  if (frame && run === geoRun) frameStores();
}

function frameStores() {
  var pts = STORES.filter(function (s) { return s._lat != null; }).map(function (s) { return [s._lat, s._lng]; });
  if (!pts.length) map.fitBounds(DEFAULT_BOUNDS);
  else if (pts.length === 1) map.setView(pts[0], 13);
  else map.fitBounds(pts, { padding: [30, 30] });
}

function searchByZip() {
  var zip = document.getElementById('zip-input').value.trim();
  if (!zip) { refPoint = null; frameStores(); return; }
  if (typeof gtag === 'function') gtag('event', 'store_locator_search');
  geocode(zip, true).then(function (center) {
    if (!center) { alert('Could not find that zip code.'); return; }
    refPoint = L.latLng(center.lat, center.lng);
    var near = STORES.filter(function (s) { return s._lat != null; })
      .map(function (s) { return { p: [s._lat, s._lng], d: haversine(center.lat, center.lng, s._lat, s._lng) }; })
      .sort(function (a, b) { return a.d - b.d; }).slice(0, 5).filter(function (x) { return x.d <= 60; });
    var pts = near.map(function (x) { return x.p; }); pts.push([center.lat, center.lng]);
    map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
    renderList();
  });
}
var youMarker = null;
function showYou(lat, lng) {
  userPoint = L.latLng(lat, lng);
  if (youMarker) map.removeLayer(youMarker);
  youMarker = L.marker(userPoint, { icon: L.divIcon({ className: '', html: '<div class="you-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), interactive: false, keyboard: false }).addTo(map);
}
function locate(cb, errCb) {
  navigator.geolocation.getCurrentPosition(function (pos) { showYou(pos.coords.latitude, pos.coords.longitude); cb(); }, errCb || function () {},
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
}
// "Near me": zoom to the closest stores and measure from the visitor
function nearMe() {
  var btn = document.getElementById('near-btn');
  if (!navigator.geolocation) { alert('Your browser can\'t share your location. Try searching by zip code.'); return; }
  if (typeof gtag === 'function') gtag('event', 'store_locator_near_me');
  btn.disabled = true; btn.textContent = 'Locating…';
  locate(function () {
    btn.disabled = false; btn.innerHTML = '&#9678; Near me';
    document.getElementById('zip-input').value = ''; refPoint = null;
    var near = STORES.filter(function (s) { return s._lat != null; })
      .map(function (s) { return { p: [s._lat, s._lng], d: haversine(userPoint.lat, userPoint.lng, s._lat, s._lng) }; })
      .sort(function (a, b) { return a.d - b.d; }).slice(0, 3);
    var pts = near.map(function (x) { return x.p; }); pts.push([userPoint.lat, userPoint.lng]);
    map.fitBounds(pts, { padding: [50, 50], maxZoom: 14 });
    renderList();
  }, function (err) {
    btn.disabled = false; btn.innerHTML = '&#9678; Near me';
    alert(err && err.code === 1 ? 'Location is turned off for this site. Allow it in your browser, or search by zip code.' : 'Couldn\'t get your location. Try searching by zip code.');
  });
}
// On page load, quietly measure distances from the visitor (the browser asks permission once). Map framing is unchanged.
function autoLocate() {
  if (!navigator.geolocation) return;
  locate(function () { renderList(); });
}
document.getElementById('zip-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') searchByZip(); });
document.getElementById('zip-input').addEventListener('input', function () { if (!this.value.trim()) refPoint = null; });

// Live refresh: re-check the feed every minute and rebuild only if the store list (or coordinates) changed.
var POLL_MS = 60000, lastSig = '';
function sig(list) { return (list || []).map(function (s) { return [s.name, s.address, s.lat, s.lng].join('|'); }).sort().join('~~'); }
function refreshStores() {
  fetchStores().then(function (data) {
    var g = sig(data); if (g === lastSig) return;
    lastSig = g; loadStores(data, false);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  map = L.map('map', { scrollWheelZoom: true });
  // OpenFreeMap vector tiles (free, no API key). Falls back to standard OSM tiles if the vector library can't load.
  try {
    L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/liberty', attribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  } catch (e) {
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  }
  map.fitBounds(DEFAULT_BOUNDS);
  map.on('moveend zoomend', renderList);   // scrolling / panning / zooming the map reloads the list
  document.getElementById('loading-state').style.display = 'block';
  fetchStores().then(function (data) { lastSig = sig(data); loadStores(data, true); });
  setInterval(refreshStores, POLL_MS);
  autoLocate();
});
</script>
